# Default GitHub repo for remote install (owner/name, no .git).
# Override: GITHUB_REPO=you/other install-remote.sh
GITHUB_REPO=andreev-sy/cursor-tools
GITHUB_BRANCH=main

# Install namespace under the target project (also used as skill name prefix).
# Override: KIT_NAME=my-kit ./install.sh
KIT_NAME=cursor-tools
